<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>平面世界の地図 試作2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono&display=swap">
<style>
:root{
  --paper:#efe5cf; --paper-2:#e6d8bb; --paper-3:#d9c7a3;
  --ink:#3d2b1c; --ink-2:#6b5440; --ink-3:#9a8166;
  --sea:#7d9496; --rust:#a4472b; --blue:#3f6b7a;
  --body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --name:"Cormorant Garamond","Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper-2);color:var(--ink);font:14px/1.5 var(--body);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:6px 12px;background:var(--paper);border-bottom:1px solid var(--ink-3)}
header h1{font-size:15px;margin:0 8px 0 0;letter-spacing:.04em}
header label{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
header .grp{display:inline-flex;gap:2px;border:1px solid var(--ink-3);border-radius:4px;overflow:hidden}
header .grp button{border:0;border-radius:0}
button{font:inherit;background:#f6efdf;border:1px solid var(--ink-3);border-radius:3px;padding:3px 9px;color:var(--ink);cursor:pointer}
button.on{background:var(--ink);color:var(--paper)}
input[type=number]{font:inherit;background:#f6efdf;border:1px solid var(--ink-3);border-radius:3px;padding:2px 6px;width:7em}
input[type=range]{width:90px}
#box{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--paper);touch-action:none;cursor:grab}
#box.drag{cursor:grabbing}
#map{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:10px;top:8px;font:12px/1.5 var(--mono);white-space:pre;background:rgba(239,229,207,.85);padding:5px 9px;border-radius:3px;pointer-events:none;border:1px solid rgba(61,43,28,.25)}
#dbg{position:absolute;left:10px;bottom:34px;font:12px/1.5 var(--mono);white-space:pre;background:rgba(30,22,14,.82);color:#f3ead6;padding:6px 10px;border-radius:3px;pointer-events:none}
#note{position:absolute;right:10px;bottom:8px;font-size:12px;color:var(--ink-2);background:rgba(239,229,207,.8);padding:2px 8px;border-radius:3px;pointer-events:none}
.hint{font-size:12px;color:var(--ink-2)}
@media (max-width:700px){header h1{width:100%} header .hint{display:none} #hud{font-size:11px}}
</style>
</head>
<body>
<header>
  <h1>平面世界の地図 試作2</h1>
  <span class="grp">
    <button id="mPlane" class="on" title="工学座標そのまま。距離と方位がどこでも正確">平面</button>
    <button id="mLog" title="横が極の周りの向き、縦が極からの距離の対数。羅針盤一定の航路が直線になる海図">海図（対数極）</button>
    <button id="mDisc" title="無限の平面を一枚の円に。縁が無限遠">全体図（円盤）</button>
  </span>
  <label>seed <input type="number" id="seed" value="7"></label>
  <button id="reseed">乱数</button>
  <label>最細レベル <input type="number" id="finest" min="6" max="12" value="10" style="width:4em"></label>
  <label>陰影 <input type="range" id="shade" min="0" max="200" value="100"></label>
  <label><input type="checkbox" id="lContour" checked>等高線</label>
  <label><input type="checkbox" id="lIso" checked>等深線</label>
  <label><input type="checkbox" id="lWave" checked>水線</label>
  <label><input type="checkbox" id="lRiver" checked>川と湖</label>
  <label><input type="checkbox" id="lLabel" checked>地名</label>
  <label><input type="checkbox" id="lLit" checked>照らす円</label>
  <label><input type="checkbox" id="lHoly" checked>極と聖地</label>
  <button id="home">中心へ</button>
  <span class="hint">ドラッグで移動、ホイールで拡大、F2 でデバッグ表示</span>
</header>
<div id="box">
  <canvas id="map"></canvas>
  <div id="hud"></div>
  <div id="dbg" hidden></div>
  <div id="note">地形と地名は仮の生成（地形工房からの書き出しは試作3）</div>
</div>
<script>
"use strict";
const SRC=document.currentScript.textContent;
/*GEN1*/
/* ---------- noise toolbox (same as 地形工房) ---------- */
const G=[[1,0],[-1,0],[0,1],[0,-1],[.7071,.7071],[-.7071,.7071],[.7071,-.7071],[-.7071,-.7071]];
function ih(ix,iy,s){let h=Math.imul(ix|0,0x27d4eb2d)^Math.imul(iy|0,0x165667b1)^Math.imul(s|0,0x9e3779b1);h=Math.imul(h^(h>>>15),0x85ebca6b);h=Math.imul(h^(h>>>13),0xc2b2ae35);return (h^(h>>>16))>>>0;}
function rnd(i,j,s){return ih(i,j,s)/4294967296;}
function noise(x,y,s){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
  const u=fx*fx*fx*(fx*(fx*6-15)+10),v=fy*fy*fy*(fy*(fy*6-15)+10);
  const g00=G[ih(ix,iy,s)&7],g10=G[ih(ix+1,iy,s)&7],g01=G[ih(ix,iy+1,s)&7],g11=G[ih(ix+1,iy+1,s)&7];
  const n00=g00[0]*fx+g00[1]*fy,n10=g10[0]*(fx-1)+g10[1]*fy,n01=g01[0]*fx+g01[1]*(fy-1),n11=g11[0]*(fx-1)+g11[1]*(fy-1);
  const a=n00+(n10-n00)*u,b=n01+(n11-n01)*u;return (a+(b-a)*v)*1.6;}
function fbm(x,y,s,oct,gain){let sum=0,amp=1,f=1;for(let i=0;i<oct;i++){sum+=amp*noise(x*f+i*17.31,y*f-i*9.17,s+i*101);amp*=gain;f*=2;}return sum*0.6;}
function ridged(x,y,s,oct){let sum=0,amp=1,f=1,norm=0;for(let i=0;i<oct;i++){const n=1-Math.abs(noise(x*f+i*7.7,y*f+i*3.1,s+i*131));sum+=amp*n*n;norm+=amp;amp*=.5;f*=2;}return sum/norm;}
function smooth(a,b,v){let t=(v-a)/(b-a);t=t<0?0:t>1?1:t;return t*t*(3-2*t);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
/* ---------- stand-in terrain: a fixed function of the world position, so every level samples the same ground ---------- */
const LIT_KM=2200;
function heightAt(X,Y,seed){            // X east, Y north in metres -> height in metres
  const x=X/1e3,y=Y/1e3,r=Math.hypot(x,y);
  const wx=fbm(x/900,y/900,seed+1,4,.5)*260,wy=fbm(x/900+5.2,y/900+1.3,seed+2,4,.5)*260;
  let s=fbm((x+wx)/1300,(y+wy)/1300,seed,8,.5);
  s+=.16*smooth(LIT_KM*1.6,LIT_KM*.7,r)-.13;        // the lit world holds the continents; outside, a wide ocean with scattered frontier land
  let e;
  if(s>=0){const m=ridged(x/260,y/260,seed+7,7);e=40+1900*s+2600*m*m*smooth(.04,.3,s);}
  else if(s>=-.035) e=-140*(-s/.035);
  else if(s>=-.1) e=-140-3560*smooth(0,1,(-s-.035)/.065);
  else e=-3700-700*smooth(0,.25,-s-.1);
  const d=fbm(x/45,y/45,seed+3,6,.5);
  e+=(s>=0?(d>0?d*(90+160*smooth(0,.25,s)):d*35):d*60);
  e+=fbm(x/3,y/3,seed+4,4,.5)*(s>=0?14:6);
  if(e<-2500){const sm=ridged(x/120,y/120,seed+11,4);e+=2200*Math.pow(Math.max(0,sm-.72)/.28,2);}
  if(r>LIT_KM*1.3&&e>=0) e*=1+.6*smooth(LIT_KM*1.3,LIT_KM*3,r);   // the frontier is harsher: taller, colder land
  return e;
}
/* ---------- hydrology on a coarse grid of the lit world: fill the pits, follow the water, find rivers, lakes, land masses and peaks ---------- */
function hydro(H,n,C,X0,Y0){
  const N2=n*n,F=new Float32Array(H),closed=new Uint8Array(N2),order=new Int32Array(N2);let no=0;
  // binary heap keyed by elevation
  const hk=new Float32Array(N2),hi=new Int32Array(N2);let hn=0;
  const push=(k,i)=>{let p=hn++;hk[p]=k;hi[p]=i;while(p>0){const q=(p-1)>>1;if(hk[q]<=hk[p]) break;const tk=hk[q],ti=hi[q];hk[q]=hk[p];hi[q]=hi[p];hk[p]=tk;hi[p]=ti;p=q;}};
  const pop=()=>{const i=hi[0];hn--;if(hn>0){hk[0]=hk[hn];hi[0]=hi[hn];let p=0;for(;;){let l=2*p+1,r=l+1,m=p;if(l<hn&&hk[l]<hk[m]) m=l;if(r<hn&&hk[r]<hk[m]) m=r;if(m===p) break;const tk=hk[m],ti=hi[m];hk[m]=hk[p];hi[m]=hi[p];hk[p]=tk;hi[p]=ti;p=m;}}return i;};
  const NB=[-1,1,-n,n,-n-1,-n+1,n-1,n+1];
  for(let k=0;k<N2;k++){if(H[k]<0){closed[k]=1;continue;}const r=(k/n)|0,c=k%n;
    if(r===0||c===0||r===n-1||c===n-1){closed[k]=1;push(H[k],k);continue;}
    if(H[k-1]<0||H[k+1]<0||H[k-n]<0||H[k+n]<0){closed[k]=1;push(H[k],k);}}
  while(hn>0){const k=pop();order[no++]=k;const r=(k/n)|0,c=k%n;
    for(let q=0;q<8;q++){const d=NB[q];const rr=r+((d===-n||d===-n-1||d===-n+1)?-1:(d===n||d===n-1||d===n+1)?1:0),cc=c+((d===-1||d===-n-1||d===n-1)?-1:(d===1||d===-n+1||d===n+1)?1:0);
      if(rr<0||cc<0||rr>=n||cc>=n) continue;const m=k+d;if(closed[m]) continue;closed[m]=1;
      F[m]=Math.max(H[m],F[k]+1e-3);push(F[m],m);}}
  // downstream cell and accumulation (cells), highest first
  const down=new Int32Array(N2).fill(-1),acc=new Float32Array(N2);
  for(let t=no-1;t>=0;t--){const k=order[t],r=(k/n)|0,c=k%n;let best=-1,bs=0;
    for(let q=0;q<8;q++){const d=NB[q];const rr=r+((d===-n||d===-n-1||d===-n+1)?-1:(d===n||d===n-1||d===n+1)?1:0),cc=c+((d===-1||d===-n-1||d===n-1)?-1:(d===1||d===-n+1||d===n+1)?1:0);
      if(rr<0||cc<0||rr>=n||cc>=n) continue;const m=k+d,fm=H[m]<0?H[m]:F[m],sl=(F[k]-fm)/(q<4?1:1.4142);if(sl>bs){bs=sl;best=m;}}
    down[k]=best;acc[k]+=1;if(best>=0) acc[best]+=acc[k];}
  // lakes: where the fill raised the ground
  const lake=new Float32Array(N2).fill(NaN);for(let k=0;k<N2;k++) if(H[k]>=0&&F[k]-H[k]>.6) lake[k]=F[k];
  // land masses: 4-connected land, named at the cell farthest from the shore
  const comp=new Int32Array(N2).fill(-1),lands=[];const stack=new Int32Array(N2);
  const dist=edt(H,n,n,k=>H[k]<0);          // distance to the sea for land cells
  for(let k=0;k<N2;k++){if(H[k]<0||comp[k]>=0) continue;const id=lands.length;let sp=0,area=0,best=k,bd=-1;stack[sp++]=k;comp[k]=id;
    while(sp>0){const m=stack[--sp];area++;if(dist[m]>bd){bd=dist[m];best=m;}const r=(m/n)|0,c=m%n;
      const cand=[c>0?m-1:-1,c<n-1?m+1:-1,r>0?m-n:-1,r<n-1?m+n:-1];for(const q of cand) if(q>=0&&H[q]>=0&&comp[q]<0){comp[q]=id;stack[sp++]=q;}}
    lands.push({area:area*C*C,x:X0+(best%n+.5)*C,y:Y0-(((best/n)|0)+.5)*C,w:bd*C,id});}
  // lakes as components
  const lcomp=new Int32Array(N2).fill(-1),lakes=[];
  for(let k=0;k<N2;k++){if(!(lake[k]===lake[k])||lcomp[k]>=0) continue;const id=lakes.length;let sp=0,area=0,sx=0,sy=0,depth=0;stack[sp++]=k;lcomp[k]=id;
    while(sp>0){const m=stack[--sp];area++;sx+=m%n;sy+=(m/n)|0;if(F[m]-H[m]>depth) depth=F[m]-H[m];const r=(m/n)|0,c=m%n;
      const cand=[c>0?m-1:-1,c<n-1?m+1:-1,r>0?m-n:-1,r<n-1?m+n:-1];for(const q of cand) if(q>=0&&lake[q]===lake[q]&&lcomp[q]<0){lcomp[q]=id;stack[sp++]=q;}}
    if(area<6||depth<30){for(let q=0;q<N2;q++) if(lcomp[q]===id){lake[q]=NaN;lcomp[q]=-2;}continue;}
    lakes.push({area:area*C*C,x:X0+(sx/area+.5)*C,y:Y0-(sy/area+.5)*C,id});}
  lakes.sort((a,b)=>b.area-a.area);if(lakes.length>400){const keep=new Set(lakes.slice(0,400).map(l=>l.id));for(let q=0;q<N2;q++) if(lcomp[q]>=0&&!keep.has(lcomp[q])) lake[q]=NaN;lakes.length=400;}
  // rivers: from each mouth upstream along the biggest feeder (the main stem), then the tributaries that join it
  const thr=40,inRiver=new Uint8Array(N2),pts=[],rivers=[];
  const isRiv=k=>H[k]>=0&&acc[k]>=thr&&!(lake[k]===lake[k]);
  const nbrs=(k,fn)=>{const r=(k/n)|0,c=k%n;for(let q=0;q<8;q++){const d=NB[q];const rr=r+((d===-n||d===-n-1||d===-n+1)?-1:(d===n||d===n-1||d===n+1)?1:0),cc=c+((d===-1||d===-n-1||d===n-1)?-1:(d===1||d===-n+1||d===n+1)?1:0);
    if(rr<0||cc<0||rr>=n||cc>=n) continue;fn(k+d);}};
  const upOf=k=>{let best=-1,ba=0;nbrs(k,m=>{if(down[m]===k&&isRiv(m)&&!inRiver[m]&&acc[m]>ba){ba=acc[m];best=m;}});return best;};
  const trace=(k0,endPt)=>{const line=[];if(endPt>=0) line.push(endPt);let k=k0;while(k>=0&&!inRiver[k]){inRiver[k]=1;line.push(k);k=upOf(k);}
    if(line.length<3) return;line.reverse();const st=pts.length;for(const q of line) pts.push(X0+(q%n+.5)*C,Y0-(((q/n)|0)+.5)*C,acc[q]);rivers.push({st,en:pts.length,mx:acc[k0]});};
  const mouths=[];for(let k=0;k<N2;k++){if(!isRiv(k)) continue;const d=down[k];if(d<0||!isRiv(d)) mouths.push(k);}
  mouths.sort((a,b)=>acc[b]-acc[a]);
  for(const m of mouths){const d=down[m];trace(m,d>=0&&(H[d]<0||lake[d]===lake[d])?d:-1);}
  for(let pass=0;pass<40;pass++){let more=false;for(let k=0;k<N2;k++){if(!isRiv(k)||inRiver[k]) continue;const d=down[k];if(d>=0&&inRiver[d]){trace(k,d);more=true;}}if(!more) break;}
  // peaks: local maxima of the coarse grid
  const peaks=[];for(let r=3;r<n-3;r++)for(let c=3;c<n-3;c++){const k=r*n+c,h=H[k];if(h<2200) continue;let top=true;
    for(let dr=-3;dr<=3&&top;dr++)for(let dc=-3;dc<=3;dc++){if(dr===0&&dc===0) continue;if(H[k+dr*n+dc]>=h){top=false;break;}}
    if(top) peaks.push({x:X0+(c+.5)*C,y:Y0-(r+.5)*C,h});}
  peaks.sort((a,b)=>b.h-a.h);
  return {lake,pts:new Float32Array(pts),rivers,lands,lakes,peaks:peaks.slice(0,80)};
}
// Felzenszwalb distance transform: distance (in cells) from each cell to the nearest cell where isZero(k) holds
function edt(H,W,Hh,isZero){
  const INF=1e12,f=new Float64Array(W*Hh);for(let k=0;k<W*Hh;k++) f[k]=isZero(k)?0:INF;
  const n=Math.max(W,Hh),d=new Float64Array(n),v=new Int32Array(n),z=new Float64Array(n+1),g=new Float64Array(n);
  const dt=(len)=>{let k=0;v[0]=0;z[0]=-INF;z[1]=INF;
    for(let q=1;q<len;q++){let s=((g[q]+q*q)-(g[v[k]]+v[k]*v[k]))/(2*q-2*v[k]);while(s<=z[k]){k--;s=((g[q]+q*q)-(g[v[k]]+v[k]*v[k]))/(2*q-2*v[k]);}k++;v[k]=q;z[k]=s;z[k+1]=INF;}
    k=0;for(let q=0;q<len;q++){while(z[k+1]<q) k++;d[q]=(q-v[k])*(q-v[k])+g[v[k]];}};
  for(let c=0;c<W;c++){for(let r=0;r<Hh;r++) g[r]=f[r*W+c];dt(Hh);for(let r=0;r<Hh;r++) f[r*W+c]=d[r];}
  for(let r=0;r<Hh;r++){for(let c=0;c<W;c++) g[c]=f[r*W+c];dt(W);for(let c=0;c<W;c++) f[r*W+c]=d[c];}
  const out=new Float32Array(W*Hh);for(let k=0;k<W*Hh;k++) out[k]=Math.sqrt(f[k]);return out;
}
/*GEN2*/
/* ---------- worker: tiles (N cells + a skirt all round, north row first), coarse bands for the hydrology, the hydrology itself ---------- */
const WORKER_SRC=SRC.slice(SRC.indexOf("/*GEN1*/"),SRC.indexOf("/*GEN2*/"))+`
onmessage=e=>{const m=e.data;
  if(m.kind==="tile"){const {id,z,i,j,N,SK,seed,T0}=m,T=T0/Math.pow(2,z),s=T/N,M=N+2*SK,E=new Float32Array(M*M);
    for(let r=0;r<M;r++){const Y=(j+1)*T-(r-SK+.5)*s;for(let c=0;c<M;c++){E[r*M+c]=heightAt(i*T+(c-SK+.5)*s,Y,seed);}}
    postMessage({kind:"tile",id,buf:E.buffer},[E.buffer]);}
  else if(m.kind==="band"){const {r0,r1,n,C,X0,Y0,seed}=m,out=new Float32Array((r1-r0)*n);
    for(let r=r0;r<r1;r++){const Y=Y0-(r+.5)*C;for(let c=0;c<n;c++) out[(r-r0)*n+c]=heightAt(X0+(c+.5)*C,Y,seed);}
    postMessage({kind:"band",r0,seed,buf:out.buffer},[out.buffer]);}
  else if(m.kind==="hydro"){const {n,C,X0,Y0,seed}=m,H=new Float32Array(m.buf),t0=Date.now(),h=hydro(H,n,C,X0,Y0);
    postMessage({kind:"hydro",seed,n,C,X0,Y0,ms:Date.now()-t0,lake:h.lake.buffer,pts:h.pts.buffer,rivers:h.rivers,lands:h.lands,lakes:h.lakes,peaks:h.peaks},[h.lake.buffer,h.pts.buffer]);}
};`;

/* ---------- settings and view ---------- */
const S={seed:7,finest:10,shade:1,N:256,SK:24,T0:8388608,litR:2200e3,baseLevel:6,hydroC:4000,hydroR:1.2};
const HOLY=[{n:"極",x:0,y:0,pole:true},{n:"聖地A",x:-520e3,y:340e3},{n:"聖地B",x:610e3,y:-180e3},{n:"聖地C",x:120e3,y:-700e3}];
const layers={lContour:true,lIso:true,lWave:true,lRiver:true,lLabel:true,lLit:true,lHoly:true};
const view={mode:"plane",x:0,y:0,zoom:1.2,lu:0,lv:0,lz:0};   // plane: centre (m) + zoom (m/px = 32768/2^zoom); log chart: centre (rad, ln r/R0) + zoom
const $=id=>document.getElementById(id);
const box=$("box"),mapC=$("map"),hud=$("hud"),dbg=$("dbg");
function tileSize(z){return S.T0/Math.pow(2,z);}
function mpp(){return 32768/Math.pow(2,view.zoom);}
function landStepFor(z){return z<=2?1000:z<=4?500:z<=6?250:z<=8?100:z<=10?50:20;}
const ISO=[-200,-1000,-2000,-3000,-4000,-5000,-6000];

/* ---------- tile store: generated on demand by a worker pool, kept in an LRU ---------- */
const store=new Map(),queue=[];let tick=0,inflight=0;
const pool=[];let hydroW=null;
function makeWorkers(){
  const n=Math.max(1,Math.min(8,(navigator.hardwareConcurrency||4)-1)),url=URL.createObjectURL(new Blob([WORKER_SRC],{type:"text/javascript"}));
  for(let k=0;k<n;k++){const w=new Worker(url);w.busy=false;w.onmessage=e=>{const m=e.data;
    if(m.kind==="tile"){const rec=store.get(m.id);w.busy=false;inflight--;if(rec&&rec.seed===S.seed){rec.E=new Float32Array(m.buf);rec.pending=false;rec.img=null;schedule();}pump();}
    else if(m.kind==="band"){w.busy=false;bandDone(m);pump();}};pool.push(w);}
  hydroW=new Worker(url);hydroW.onmessage=e=>hydroDone(e.data);
}
function pump(){
  queue.sort((a,b)=>b.pri-a.pri);
  for(const w of pool){if(w.busy) continue;
    if(hydroBands.length){const b=hydroBands.pop();w.busy=true;w.postMessage(Object.assign({kind:"band"},b));continue;}
    let rec;while(queue.length){const q=queue.pop();if(q.seed===S.seed&&!q.E&&q.pending){rec=q;break;}}

/* ---------- placeholder names until the world generator supplies real ones ---------- */
const SYL={c:["b","d","g","h","k","l","m","n","r","s","t","v","w","sk","st","br","kr","th","fr","gr"],v:["a","e","i","o","u","ei","au","ie","y"],

  let s=pick(SYL.c,0)+pick(SYL.v,5)+pick(SYL.c,10)+(h&1?pick(SYL.v,15):"");
  if(kind==="river") s=pick(SYL.c,0)+pick(SYL.v,5)+pick(SYL.c,10)+pick(SYL.river,20);

/* ---------- painting a height grid: tints, Swiss-style shading, then water lines, rivers and contours ---------- */
function landCol(e){const t=clamp(e/3200,0,1);return [233-40*t-10*t*t,221-50*t,191-62*t];}

    if(lk===lk&&lk>e){const t=clamp((lk-e)/60,0,1);d[o]=LAKE[0]-10*t;d[o+1]=LAKE[1]-8*t;d[o+2]=LAKE[2]-4*t;d[o+3]=255;continue;}
    const sp=spacing(r,c),col=e>=0?landCol(e):seaCol(e);

    const pxKm=sp/1000,zf=Math.max(1,Math.sqrt(.5/pxKm));                 // close up the real slopes are steep: tone the shading down
    const amp=e>=0?(.16+.2*clamp(e/2500,0,1)):.10;                        // aerial perspective: stronger high up, calm on the plains and the sea

// marching squares over the whole grid; seg(x1,y1,x2,y2) gets grid coordinates (cell centres at +.5)

      const ea=a0,eb=a1,ed=d0,ee=d1;a0=a1;d0=d1;
      const code=(A?8:0)|(B?4:0)|(F?2:0)|(D?1:0);if(code===0||code===15||ea!==ea||eb!==eb||ed!==ed||ee!==ee) continue;

const WAVE=[2.4,3.3,4.4,5.8,7.6,9.9,12.8,16.5];   // water lines: spacing grows by about a quarter each line
// draws water lines, coast, isobaths, contours and lake shores of grid E onto ctx; toX/toY map grid coordinates to the ctx

    isoSegs(A,M,N2,t,(x1,y1,x2,y2)=>{ctx.moveTo(toX(x1+.5),toY(y1+.5));ctx.lineTo(toX(x2+.5),toY(y2+.5));});ctx.stroke();};
  if(layers.lWave&&waves){const D=edt(E,M,N2,k=>E[k]>=0||(LK&&LK[k]>E[k]));
    WAVE.forEach((w,i)=>iso(D,w*waves,"rgba(63,107,122,"+(.5-.055*i).toFixed(3)+")",.7));}

// rivers as smoothed, tapered strokes; toS maps world metres to ctx pixels, pxPerM scales the width

  let ph=hAt(pts[0][0],pts[0][1]);if(ph>=0||ph!==ph) cur.push(pts[0]);

function drawRivers(ctx,x0,y0,x1,y1,toS,pxPerM,zEff,hAt){

/* ---------- plane view: tiles of one level, parents fill in while a tile is still being made ---------- */
function drawPlane(ctx,W,H){

  return {z:zEff,shown:0,missing};
}
function discParams(W,H){return {cx:W/2,cy:H/2,Rm:Math.min(W,H)/2-26,R0:S.litR};}
const DISC_RMAX=14;   // the chart shows out to 14 lit radii; beyond that nobody has sailed, and the paper fades out
function discInv(W,H){const {cx,cy,Rm,R0}=discParams(W,H);return (sx,sy)=>{const dx=sx-cx,dy=cy-sy,rho=Math.hypot(dx,dy);if(rho>=Rm*DISC_RMAX/(DISC_RMAX+1)) return null;
  const r=R0*rho/(Rm-rho),sc=R0*Rm/((Rm-rho)*(Rm-rho));const f=rho>0?r/rho:0;return [dx*f,dy*f,Math.max(sc,R0/Rm)];};}
function discFwd(W,H,X,Y){const {cx,cy,Rm,R0}=discParams(W,H),r=Math.hypot(X,Y),rho=Rm*r/(r+R0),f=r>0?rho/r:0;return [cx+X*f,cy-Y*f];}
function logPPR(W){return W/(2*Math.PI)*Math.pow(2,view.lz);}
function logInv(W,H){const ppr=logPPR(W),R0=S.litR;return (sx,sy)=>{const th=view.lu+(sx-W/2)/ppr,v=view.lv-(sy-H/2)/ppr;if(v>Math.log(60)||v<Math.log(1e-4)) return null;
  const r=R0*Math.exp(v);return [r*Math.sin(th),r*Math.cos(th),r/ppr];};}
function logFwd(W,H,X,Y){const ppr=logPPR(W),r=Math.hypot(X,Y);if(r<=0) return null;let th=Math.atan2(X,Y)-view.lu;th=((th+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
  return [W/2+th*ppr,H/2-(Math.log(r/S.litR)-view.lv)*ppr];}

/* ---------- overlays: the lit circle, the pole and the holy sites, the scale bar ---------- */
function toScreen(W,H,X,Y){
  if(view.mode==="plane"){const m=mpp();return [W/2+(X-view.x)/m,H/2-(Y-view.y)/m];}
  if(view.mode==="disc") return discFwd(W,H,X,Y);
  return logFwd(W,H,X,Y);
}
function drawOverlay(ctx,W,H){
  ctx.save();ctx.font="12px "+getComputedStyle(document.body).getPropertyValue("--body");
  if(layers.lLit){ctx.strokeStyle="#3d2b1c";ctx.lineWidth=1.4;ctx.setLineDash([6,5]);ctx.beginPath();
    if(view.mode==="plane"){const m=mpp(),[ox,oy]=toScreen(W,H,0,0),R=S.litR/m;if(R<4e4) ctx.arc(ox,oy,R,0,6.2832);}
    else if(view.mode==="disc"){const {cx,cy,Rm}=discParams(W,H);ctx.arc(cx,cy,Rm/2,0,6.2832);ctx.moveTo(cx+Rm,cy);ctx.arc(cx,cy,Rm,0,6.2832);}
    else{const p=logFwd(W,H,S.litR,0);if(p){ctx.moveTo(0,p[1]);ctx.lineTo(W,p[1]);}}
    ctx.stroke();ctx.setLineDash([]);}
  if(layers.lHoly){for(const h of HOLY){const p=toScreen(W,H,h.x,h.y);if(!p||p[0]<-20||p[0]>W+20||p[1]<-20||p[1]>H+20) continue;
    ctx.fillStyle="#efe5cf";ctx.strokeStyle=h.pole?"#a4472b":"#3d2b1c";ctx.lineWidth=1.6;ctx.beginPath();
    if(h.pole){ctx.arc(p[0],p[1],6,0,6.2832);ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(p[0],p[1],2,0,6.2832);ctx.fillStyle="#a4472b";ctx.fill();}
    else{for(let k=0;k<8;k++){const a=k*Math.PI/4,rr=k%2?3:8;ctx.lineTo(p[0]+rr*Math.sin(a),p[1]-rr*Math.cos(a));}ctx.closePath();ctx.fill();ctx.stroke();}
    const tw=ctx.measureText(h.n).width;ctx.fillStyle="rgba(239,229,207,.85)";ctx.fillRect(p[0]+9,p[1]-9,tw+6,16);ctx.fillStyle=h.pole?"#a4472b":"#3d2b1c";ctx.fillText(h.n,p[0]+12,p[1]+3);
    labelBoxes.push([p[0]-9,p[1]-9,p[0]+15+tw,p[1]+9]);}}
  if(view.mode==="plane"){const m=mpp();let km=Math.pow(10,Math.floor(Math.log10(m*W*.25/1000)));if(km*2.5*1000/m<W*.25) km*=2.5;else if(km*2*1000/m<W*.25) km*=2;
    const L=km*1000/m,x0=14,y0=H-18;ctx.strokeStyle="#3d2b1c";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x0+L,y0);ctx.moveTo(x0,y0-5);ctx.lineTo(x0,y0+3);ctx.moveTo(x0+L,y0-5);ctx.lineTo(x0+L,y0+3);ctx.stroke();
    ctx.font="12px "+getComputedStyle(document.body).getPropertyValue("--mono");ctx.fillStyle="#3d2b1c";ctx.fillText(km>=1?km+" km":Math.round(km*1000)+" m",x0+L+10,y0+4);}
  if(view.mode==="log"){ctx.font="12px "+getComputedStyle(document.body).getPropertyValue("--mono");ctx.fillStyle="#3d2b1c";ctx.strokeStyle="rgba(61,43,28,.35)";ctx.lineWidth=1;const ppr=logPPR(W);
    for(let d=0;d<360;d+=30){const th=d*Math.PI/180;let x=W/2+(((th-view.lu+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI)*ppr;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();ctx.fillText("θ "+d+"°",x+4,14);}
    for(const rk of [100,250,500,1000,2200,5000,10000,25000,50000]){const p=logFwd(W,H,rk*1e3,0);if(!p||p[1]<0||p[1]>H) continue;ctx.beginPath();ctx.moveTo(0,p[1]);ctx.lineTo(W,p[1]);ctx.stroke();ctx.fillText("r "+rk.toLocaleString()+" km",6,p[1]-4);}}
  if(view.mode==="disc"){const {cx,cy,Rm}=discParams(W,H),re=Rm*DISC_RMAX/(DISC_RMAX+1),g=ctx.createRadialGradient(cx,cy,re*.78,cx,cy,re*.97);
    g.addColorStop(0,"rgba(239,229,207,0)");g.addColorStop(1,"rgba(239,229,207,1)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,Rm,0,6.2832);ctx.fill();
    ctx.fillStyle="#6b5440";ctx.font="12px "+getComputedStyle(document.body).getPropertyValue("--body");ctx.textAlign="center";ctx.fillText("縁が無限遠。照らす円は内側の半分",cx,cy+Rm+18);ctx.textAlign="start";}
  ctx.restore();
}

/* ---------- names: placed on the screen each frame in priority order, never overlapping ---------- */
let labelBoxes=[];
function boxFree(b){for(const o of labelBoxes) if(b[0]<o[2]&&b[2]>o[0]&&b[1]<o[3]&&b[3]>o[1]) return false;return true;}
function localScale(W,H,X,Y){   // metres per pixel at this point of the current view
  if(view.mode==="plane") return mpp();const q=toScreen(W,H,X,Y);if(!q) return Infinity;const p=(view.mode==="disc"?discInv(W,H):logInv(W,H))(q[0],q[1]);return p?p[2]:Infinity;
}
function drawLabels(ctx,W,H){
  if(!HY||!layers.lLabel) return;const name=getComputedStyle(document.body).getPropertyValue("--name");ctx.save();ctx.textAlign="center";ctx.textBaseline="middle";
  const put=(txt,x,y,ang,fs,style,fill,spacing,halo)=>{ctx.font=style+" "+fs.toFixed(1)+"px "+name;if("letterSpacing" in ctx) ctx.letterSpacing=spacing+"px";
    const tw=ctx.measureText(txt).width+(("letterSpacing" in ctx)?0:spacing*txt.length),fh=fs*1.1;
    const cs=Math.abs(Math.cos(ang)),sn=Math.abs(Math.sin(ang)),bw=tw*cs+fh*sn,bh=tw*sn+fh*cs,b=[x-bw/2-3,y-bh/2-2,x+bw/2+3,y+bh/2+2];
    if(b[0]<0||b[2]>W||b[1]<0||b[3]>H||!boxFree(b)) return false;labelBoxes.push(b);
    ctx.save();ctx.translate(x,y);ctx.rotate(ang);if(halo){ctx.lineWidth=3;ctx.strokeStyle="rgba(239,229,207,.85)";ctx.lineJoin="round";ctx.strokeText(txt,0,0);}ctx.fillStyle=fill;ctx.fillText(txt,0,0);ctx.restore();return true;};
  // land masses: letter-spaced serif, size by the area on screen
  for(const l of HY.lands){if(l.area<200e6) break;const p=toScreen(W,H,l.x,l.y);if(!p) continue;const sc=localScale(W,H,l.x,l.y),apx=l.area/(sc*sc);
    if(apx<2500||apx>W*H*12) continue;const fs=clamp(11+6*Math.log10(apx/2500),11,30);
    put(l.name.toUpperCase(),p[0],p[1],0,fs,"500","#5a4330",fs*.22+fs*.1*Math.log10(Math.max(1,apx/2500)),true);}
  // rivers: italic blue along the stream, at the on-screen stretch nearest the centre
  const m0=localScale(W,H,view.x,view.y);
  if(view.mode==="plane"&&mpp()<=1500){for(const rv of HY.rivers){const bb=rv.bb,m=mpp(),x0=view.x-W/2*m,x1=view.x+W/2*m,y0=view.y-H/2*m,y1=view.y+H/2*m;
      if(bb[2]<x0||bb[0]>x1||bb[3]<y0||bb[1]>y1) continue;if(rv.mx<40*Math.pow(Math.max(1,m/150),1.2)) continue;
      let best=-1,bd=1e18;for(let p=rv.st+9;p<rv.en-9;p+=3){const d=(HY.pts[p]-view.x)**2+(HY.pts[p+1]-view.y)**2;if(d<bd&&HY.pts[p]>x0&&HY.pts[p]<x1&&HY.pts[p+1]>y0&&HY.pts[p+1]<y1){bd=d;best=p;}}
      if(best<0) continue;const a=toScreen(W,H,HY.pts[best-9],HY.pts[best-8]),b=toScreen(W,H,HY.pts[best+9],HY.pts[best+10]),c=toScreen(W,H,HY.pts[best],HY.pts[best+1]);
      let ang=Math.atan2(b[1]-a[1],b[0]-a[0]);if(ang>Math.PI/2) ang-=Math.PI;if(ang<-Math.PI/2) ang+=Math.PI;
      const fs=clamp(10+2.2*Math.log10(rv.mx),11,17);put(rv.name,c[0],c[1]-fs*.8,ang,fs,"italic 500","#3f6b7a",fs*.06,true);}}
  // lakes
  for(const l of HY.lakes){const p=toScreen(W,H,l.x,l.y);if(!p) continue;const sc=localScale(W,H,l.x,l.y),apx=l.area/(sc*sc);if(apx<2500) continue;
    const fs=clamp(10+4*Math.log10(apx/2500),11,20);put(l.name,p[0],p[1],0,fs,"italic 500","#3f6b7a",fs*.1,true);}
  // peaks: a small triangle and the height, close up only
  if(view.mode==="plane"&&mpp()<=600){ctx.font="11px "+getComputedStyle(document.body).getPropertyValue("--mono");
    for(const pk of HY.peaks){const p=toScreen(W,H,pk.x,pk.y);if(p[0]<0||p[0]>W||p[1]<0||p[1]>H) continue;
      const txt=pk.name+" "+Math.round(pk.h)+" m",b=[p[0]-6,p[1]-16,p[0]+ctx.measureText(txt).width+8,p[1]+6];if(!boxFree(b)) continue;labelBoxes.push(b);
      ctx.fillStyle="#3d2b1c";ctx.beginPath();ctx.moveTo(p[0],p[1]-5);ctx.lineTo(p[0]+4,p[1]+2);ctx.lineTo(p[0]-4,p[1]+2);ctx.closePath();ctx.fill();
      ctx.textAlign="left";ctx.lineWidth=3;ctx.strokeStyle="rgba(239,229,207,.85)";ctx.strokeText(txt,p[0]+7,p[1]-5);ctx.fillText(txt,p[0]+7,p[1]-5);ctx.textAlign="center";}}
  ctx.restore();
}

/* ---------- render loop ---------- */
let renderTimer=0,stats={z:0,shown:0,missing:0,ms:0};
function schedule(){if(renderTimer) return;renderTimer=setTimeout(()=>{renderTimer=0;render();},40);}
function render(){
  const dpr=Math.min(devicePixelRatio||1,2),W=box.clientWidth,H=box.clientHeight;
  if(mapC.width!==Math.round(W*dpr)||mapC.height!==Math.round(H*dpr)){mapC.width=Math.round(W*dpr);mapC.height=Math.round(H*dpr);}
  const ctx=mapC.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
  ctx.fillStyle="#efe5cf";ctx.fillRect(0,0,W,H);
  const t0=performance.now();labelBoxes=[];
  if(view.mode==="plane") stats=drawPlane(ctx,W,H);
  else if(view.mode==="disc") stats=drawProjected(ctx,W,H,discInv(W,H),(X,Y)=>discFwd(W,H,X,Y));
  else stats=drawProjected(ctx,W,H,logInv(W,H),(X,Y)=>logFwd(W,H,X,Y));
  stats.ms=performance.now()-t0;
  drawOverlay(ctx,W,H);drawLabels(ctx,W,H);trimStore();updateHud();
}

/* ---------- readout: where the cursor is, in every coordinate system of the design ---------- */
let cursor=null;
function invScreen(W,H,sx,sy){
  if(view.mode==="plane"){const m=mpp();return [view.x+(sx-W/2)*m,view.y-(sy-H/2)*m,m];}
  if(view.mode==="disc") return discInv(W,H)(sx,sy);
  return logInv(W,H)(sx,sy);
}
function fmtKm(v){return (v/1000).toFixed(v<1e6?1:0)+" km";}
function updateHud(){
  const W=box.clientWidth,H=box.clientHeight;let s="";
  const modeName={plane:"平面",disc:"全体図（円盤）",log:"海図（対数極）"}[view.mode];
  s+=modeName+(view.mode==="plane"?"  1 px = "+(mpp()>=1000?(mpp()/1000).toFixed(2)+" km":Math.round(mpp())+" m")+"  レベル "+stats.z:"")+(hydroState==="ready"?"":"  川と湖を計算中…")+"\n";
  const p=cursor&&invScreen(W,H,cursor[0],cursor[1]);
  if(p){const [X,Y]=p,r=Math.hypot(X,Y),th=(Math.atan2(X,Y)*180/Math.PI+360)%360,h=sampleHeight(X,Y,p[2]);
    s+="工学座標  X "+fmtKm(X)+"  Y "+fmtKm(Y)+"\n極座標    r "+fmtKm(r)+"  θ "+th.toFixed(1)+"°  "+(r<=S.litR?"照らされた世界":"辺境")+"\n";
    const A=HOLY[1],B=HOLY[2],dA=Math.hypot(X-A.x,Y-A.y),dB=Math.hypot(X-B.x,Y-B.y);
    const g=Math.acos(clamp(((A.x-X)*(B.x-X)+(A.y-Y)*(B.y-Y))/(dA*dB),-1,1))*180/Math.PI;
    s+="航海者の座標  明るさの比 k "+(dA/dB).toFixed(3)+"  見込み角 γ "+g.toFixed(2)+"°\n";
    const lk=lakeLevelAt(X,Y);s+="標高 "+(h===h?Math.round(h)+" m":"（まだ）")+(lk===lk&&lk>h?"  湖 水面 "+Math.round(lk)+" m":"");}
  else s+="カーソルを地図に";
  hud.textContent=s;
  if(!dbg.hidden){let busy=0;for(const w of pool) if(w.busy) busy++;
    dbg.textContent="[debug] F2で隠す\nview "+JSON.stringify({mode:view.mode,x:Math.round(view.x),y:Math.round(view.y),zoom:+view.zoom.toFixed(3),lu:+view.lu.toFixed(3),lv:+view.lv.toFixed(3),lz:+view.lz.toFixed(2)})+
      "\ntiles cached "+store.size+"  queued "+queue.length+"  workers busy "+busy+"/"+pool.length+"\nshown "+stats.shown+"  waiting "+stats.missing+"  draw "+stats.ms.toFixed(1)+" ms  size "+W+"x"+H+
      "\nhydro "+hydroState+(HY?"  grid "+HY.n+"²  rivers "+HY.rivers.length+"  lakes "+HY.lakes.length+"  lands "+HY.lands.length+"  "+HY.ms+" ms":"");}
}

/* ---------- interaction ---------- */
let drag=null;
box.addEventListener("pointerdown",ev=>{if(ev.button!==0&&ev.pointerType==="mouse") return;box.setPointerCapture(ev.pointerId);drag={x:ev.clientX,y:ev.clientY};box.classList.add("drag");});
box.addEventListener("pointermove",ev=>{const r=box.getBoundingClientRect();cursor=[ev.clientX-r.left,ev.clientY-r.top];
  if(drag){const dx=ev.clientX-drag.x,dy=ev.clientY-drag.y;drag={x:ev.clientX,y:ev.clientY};
    if(view.mode==="plane"){const m=mpp();view.x-=dx*m;view.y+=dy*m;}
    else if(view.mode==="log"){const ppr=logPPR(box.clientWidth);view.lu-=dx/ppr;view.lv+=dy/ppr;}
    schedule();}
  else updateHud();});
const endDrag=()=>{drag=null;box.classList.remove("drag");saveView();};
box.addEventListener("pointerup",endDrag);box.addEventListener("pointercancel",endDrag);
box.addEventListener("wheel",ev=>{ev.preventDefault();const r=box.getBoundingClientRect(),sx=ev.clientX-r.left,sy=ev.clientY-r.top,f=Math.exp(-ev.deltaY*.0015);
  if(view.mode==="plane"){const m=mpp(),X=view.x+(sx-r.width/2)*m,Y=view.y-(sy-r.height/2)*m;
    view.zoom=clamp(view.zoom+Math.log2(f),-3,S.finest+1);const m2=mpp();view.x=X-(sx-r.width/2)*m2;view.y=Y+(sy-r.height/2)*m2;}
  else if(view.mode==="log"){const p0=logPPR(r.width);view.lz=clamp(view.lz+Math.log2(f),-1,8);const p1=logPPR(r.width);
    view.lu+=(sx-r.width/2)*(1/p0-1/p1);view.lv-=(sy-r.height/2)*(1/p0-1/p1);}
  schedule();saveView();},{passive:false});
let pinch=null;
box.addEventListener("touchstart",ev=>{if(ev.touches.length===2){pinch=Math.hypot(ev.touches[0].clientX-ev.touches[1].clientX,ev.touches[0].clientY-ev.touches[1].clientY);drag=null;}},{passive:true});
box.addEventListener("touchmove",ev=>{if(ev.touches.length===2&&pinch){const d=Math.hypot(ev.touches[0].clientX-ev.touches[1].clientX,ev.touches[0].clientY-ev.touches[1].clientY);
  if(view.mode==="plane") view.zoom=clamp(view.zoom+Math.log2(d/pinch),-3,S.finest+1);else if(view.mode==="log") view.lz=clamp(view.lz+Math.log2(d/pinch),-1,8);pinch=d;schedule();}},{passive:true});
box.addEventListener("touchend",()=>{pinch=null;});
window.addEventListener("keydown",ev=>{if(ev.key==="F2"){ev.preventDefault();dbg.hidden=!dbg.hidden;updateHud();}
  if(ev.key==="+"||ev.key==="="){view.zoom=clamp(view.zoom+.5,-3,S.finest+1);schedule();}if(ev.key==="-"){view.zoom=clamp(view.zoom-.5,-3,S.finest+1);schedule();}});
// switching between the plane and the chart keeps the same place and scale on screen
function syncModes(from,to){const W=box.clientWidth;
  if(from==="plane"&&to==="log"){const r=Math.hypot(view.x,view.y);view.lu=Math.atan2(view.x,view.y);
    if(r<.25*W*mpp()){view.lv=0;view.lz=0;}else{view.lv=Math.log(r/S.litR);view.lz=clamp(Math.log2(r/mpp()*2*Math.PI/W),-1,8);}}
  if(from==="log"&&to==="plane"){const r=S.litR*Math.exp(view.lv);view.x=r*Math.sin(view.lu);view.y=r*Math.cos(view.lu);view.zoom=clamp(Math.log2(32768/(r/logPPR(W))),-3,S.finest+1);}
}
function setMode(m){syncModes(view.mode,m);view.mode=m;for(const [id,k] of [["mPlane","plane"],["mLog","log"],["mDisc","disc"]]) $(id).classList.toggle("on",k===m);schedule();saveView();}
$("mPlane").onclick=()=>setMode("plane");$("mLog").onclick=()=>setMode("log");$("mDisc").onclick=()=>setMode("disc");
$("home").onclick=()=>{view.x=0;view.y=0;view.zoom=1.2;view.lu=0;view.lv=0;view.lz=0;schedule();saveView();};
function resetTiles(){store.clear();queue.length=0;lastTile.E=null;hydroStart();schedule();}
$("seed").onchange=()=>{S.seed=+$("seed").value|0;resetTiles();saveView();};
$("reseed").onclick=()=>{$("seed").value=Math.floor(Math.random()*1e6);$("seed").onchange();};
$("finest").onchange=()=>{S.finest=clamp(+$("finest").value|0,6,12);$("finest").value=S.finest;schedule();saveView();};
$("shade").oninput=()=>{S.shade=+$("shade").value/100;for(const r of store.values()) r.img=null;schedule();};
for(const k of Object.keys(layers)) $(k).onchange=()=>{layers[k]=$(k).checked;for(const r of store.values()) r.img=null;schedule();};
function saveView(){try{localStorage.setItem("sf-flatmap-2",JSON.stringify({view,seed:S.seed,finest:S.finest}));}catch(e){}}
(function load(){try{const s=JSON.parse(localStorage.getItem("sf-flatmap-2"));if(s){Object.assign(view,s.view);S.seed=s.seed;S.finest=s.finest;$("seed").value=S.seed;$("finest").value=S.finest;}}catch(e){}})();
new ResizeObserver(()=>schedule()).observe(box);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>schedule());
makeWorkers();hydroStart();setMode(view.mode);
</script>
</body>
</html>
